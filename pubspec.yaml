name: one_social_suite
description: "Write once. Share smarter. A private social command center."
publish_to: 'none'
version: 1.0.2+21

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  local_auth: ^2.3.0
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2
  camera: ^0.12.2
  path_provider: ^2.1.6
  video_player: ^2.14.1
  gal: ^2.3.3
  disk_space_plus: ^0.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  ios: true
  android: true
  remove_alpha_ios: true
  background_color_ios: "#000000"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/privacy_policy.md
